# Tooling config only. Runtime deps stay in requirements.txt (single source of truth) —
# duplicating them here would drift. A pinned lockfile (uv/pip-tools) is a separate
# follow-up; see the roadmap DevEx note.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires internet access (Semantic Scholar / OpenAlex / arXiv)",
    "integration: requires a running server and real API keys",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start lenient: pyflakes (F) + a slice of pycodestyle. Tighten over time.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]  # long lines abound in prompt templates; not worth churning now
